<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AutoLoc</title>
  <style>
    :root {
      --bg: #0f1c18;
      --panel: #163028;
      --text: #e8f2ec;
      --muted: #9bb5a8;
      --accent: #3dcf8e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse at top left, #1b3d30 0%, transparent 50%),
        radial-gradient(ellipse at bottom right, #0d281f 0%, transparent 45%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    main {
      width: min(520px, 100%);
      background: color-mix(in srgb, var(--panel) 88%, black);
      border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
      border-radius: 18px;
      padding: 2rem;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }
    h1 {
      margin: 0 0 0.4rem;
      font-size: 2rem;
      letter-spacing: -0.03em;
    }
    p {
      margin: 0 0 1.5rem;
      color: var(--muted);
      line-height: 1.5;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.1rem;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    a:hover { transform: translateY(-1px); }
    .primary {
      background: var(--accent);
      color: #062116;
    }
    .secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid color-mix(in srgb, var(--text) 25%, transparent);
    }
  </style>
</head>
<body>
  <main>
    <h1>AutoLoc</h1>
    <p>API de location de véhicules. Utilisez Swagger pour tester les endpoints, ou l’API contrats directement.</p>
    <div class="actions">
      <a class="primary" href="/swagger-ui.html">Ouvrir Swagger</a>
      <a class="secondary" href="/contract">GET /contract</a>
    </div>
  </main>
</body>
</html>
